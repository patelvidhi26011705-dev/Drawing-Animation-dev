<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganpati Drawing Animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Ganpati Bappa Morya</h1>
        <p class="subtitle">A Divine Drawing Animation</p>

        <div class="canvas-box">
            <canvas id="ganpatiCanvas" width="700" height="700"></canvas>
        </div>

        <div class="buttons">
            <button id="drawBtn">✏️ Draw Ganpati</button>
            <button id="recordBtn">🎥 Record Video</button>
            <button id="downloadBtn" disabled>⬇️ Download Video</button>
        </div>

        <p id="status">Ready to draw...</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
